spring.application.name: "diffy"
server:
  port: ${http.port:8888}

proxy:
  port: 8880

candidate: "localhost:9000"

master:
  primary: "localhost:9100"
  secondary: "localhost:9200"

service:
  protocol : "http"

serviceName : "Default Sample Service"

llm:
  # "ollama" (default, local CPU-friendly) or "anthropic"
  provider: ollama
  ollama:
    url: ${OLLAMA_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:phi3:mini}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-opus-4-7}

spring:
  mongodb:
    embedded:
      version: "7.0.14"

de:
  flapdoodle:
    mongodb:
      embedded:
        version: "7.0.14"

listComparisonMode: LEGACY

# Auto-delete Mongo docs after N days (TTL). Set days to 0 to disable.
# include-config: also expire noise rules + transformation scripts (off by default).
diffy:
  retention:
    days: 1
    include-config: true

# Proto URI mappings (optional). Set proto.config to enable proto decode in UI + comparison.
# proto.config: schemas/proto-config.json

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([diffy,%X{trace_id},%X{span_id}]) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m %n%wEx"
    file: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([diffy,%X{trace_id},%X{span_id}]) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m %n%wEx"